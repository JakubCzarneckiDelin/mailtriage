<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MailTriage - O365 Email Bot</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a2e; --paper: #f5f0e8; --cream: #ede8db;
    --gold: #d4a017; --muted: #7a7468;
    --done: #2d6a4f; --outstanding: #c0392b; --outstanding-soft: #c0392b15;
    --border: #d4cfc5; --shadow: 0 2px 12px rgba(26,26,46,0.08);
    --accent-b: #8b1a1a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; }

  /* SETUP */
  #setup-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; background: var(--ink); }
  .setup-card { background: var(--paper); border-radius: 4px; padding: 3rem 2.5rem; max-width: 520px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
  .setup-logo { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 700; color: var(--ink); margin-bottom: 0.25rem; }
  .setup-logo span { color: var(--outstanding); }
  .setup-sub { font-size: 0.82rem; color: var(--muted); margin-bottom: 2rem; font-family: 'DM Mono', monospace; }
  .setup-label { font-size: 0.75rem; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.4rem; display: block; }
  .setup-input { width: 100%; padding: 0.7rem 1rem; border: 1.5px solid var(--border); background: white; border-radius: 2px; font-family: 'DM Mono', monospace; font-size: 0.82rem; color: var(--ink); margin-bottom: 1rem; transition: border-color 0.2s; }
  .setup-input:focus { outline: none; border-color: var(--ink); }
  .mb-box { background: var(--cream); border-radius: 2px; padding: 1.25rem; margin-bottom: 1rem; border-left: 3px solid var(--gold); }
  .mb-box h3 { font-size: 0.8rem; font-weight: 600; margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; }
  .mb-box-a { border-left-color: var(--ink); }
  .mb-box-b { border-left-color: var(--outstanding); }
  .btn-primary { width: 100%; padding: 0.9rem; background: var(--ink); color: var(--paper); border: none; border-radius: 2px; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: background 0.2s; margin-top: 0.5rem; }
  .btn-primary:hover { background: #2d2d4e; }
  .setup-note { font-size: 0.75rem; color: var(--muted); margin-top: 1rem; line-height: 1.6; text-align: center; }

  /* APP */
  #app { display: none; flex-direction: column; min-height: 100vh; }
  header { background: var(--ink); padding: 0.9rem 1.5rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .header-logo { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: var(--paper); font-weight: 700; }
  .header-logo span { color: var(--gold); }
  .header-right { display: flex; align-items: center; gap: 0.75rem; }
  .header-date { font-family: 'DM Mono', monospace; font-size: 0.75rem; color: rgba(245,240,232,0.45); }
  .btn-hdr { background: rgba(255,255,255,0.08); color: var(--paper); border: 1px solid rgba(255,255,255,0.15); border-radius: 2px; padding: 0.35rem 0.8rem; font-size: 0.78rem; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: background 0.2s; }
  .btn-hdr:hover { background: rgba(255,255,255,0.15); }
  .btn-so { background: none; border: none; color: rgba(245,240,232,0.4); font-size: 0.75rem; cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .btn-so:hover { color: var(--paper); }

  /* SPLIT */
  .split { display: grid; grid-template-columns: 1fr 1fr; flex: 1; }
  .panel { display: flex; flex-direction: column; border-right: 1px solid var(--border); }
  .panel:last-child { border-right: none; }

  .panel-hdr { padding: 0.9rem 1.25rem 0.75rem; border-bottom: 2px solid var(--ink); position: sticky; top: 52px; z-index: 50; background: var(--paper); }
  .panel-hdr-b { border-bottom-color: var(--outstanding); }
  .panel-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 0.6rem; }
  .panel-title { font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 700; }
  .panel-addr { font-family: 'DM Mono', monospace; font-size: 0.68rem; color: var(--muted); margin-top: 0.1rem; }
  .panel-stats { display: flex; gap: 0.75rem; padding-top: 0.2rem; }
  .pst { display: flex; align-items: center; gap: 0.3rem; font-size: 0.72rem; color: var(--muted); }
  .pst-dot { width: 6px; height: 6px; border-radius: 50%; }
  .pst-n { font-family: 'DM Mono', monospace; font-size: 0.8rem; font-weight: 500; color: var(--ink); }
  .panel-ctrl { display: flex; align-items: center; gap: 0.3rem; flex-wrap: wrap; }
  .pf { padding: 0.22rem 0.55rem; border: 1.5px solid var(--border); border-radius: 2px; background: transparent; font-size: 0.7rem; font-family: 'DM Sans', sans-serif; cursor: pointer; color: var(--muted); transition: all 0.12s; }
  .pf.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .pf:not(.active):hover { border-color: var(--ink); color: var(--ink); }
  .ps { padding: 0.22rem 0.55rem; border: 1.5px solid var(--border); border-radius: 2px; font-size: 0.7rem; font-family: 'DM Sans', sans-serif; color: var(--ink); background: white; width: 110px; margin-left: auto; }
  .ps:focus { outline: none; border-color: var(--ink); }

  /* EMAILS */
  .emails { padding: 0.6rem 0.9rem 2rem; }
  .ecard { background: white; border: 1.5px solid var(--border); border-radius: 2px; padding: 0.7rem 0.85rem; margin-bottom: 0.35rem; display: grid; grid-template-columns: 7px 1fr auto; gap: 0.5rem; align-items: start; transition: border-color 0.12s, box-shadow 0.12s; }
  .ecard:hover { border-color: #aaa; box-shadow: var(--shadow); }
  .ecard.out { border-left: 3px solid var(--outstanding); }
  .ecard.unread .esubj { font-weight: 600; }
  .udot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); margin-top: 4px; }
  .rdot { width: 6px; height: 6px; border-radius: 50%; background: transparent; border: 1.5px solid var(--border); margin-top: 4px; }
  .ebody { min-width: 0; }
  .emeta { display: flex; align-items: baseline; gap: 0.4rem; margin-bottom: 0.12rem; }
  .efrom { font-size: 0.75rem; font-weight: 500; flex-shrink: 0; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .etime { font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--muted); margin-left: auto; flex-shrink: 0; }
  .esubj { font-size: 0.78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 0.1rem; }
  .eprev { font-size: 0.68rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .eacts { display: flex; flex-direction: column; gap: 0.2rem; flex-shrink: 0; }
  .ab { padding: 0.18rem 0.42rem; border-radius: 2px; border: 1.5px solid; font-size: 0.62rem; font-family: 'DM Sans', sans-serif; cursor: pointer; font-weight: 500; transition: all 0.12s; white-space: nowrap; }
  .done-btn { border-color: var(--done); color: var(--done); background: transparent; }
  .done-btn:hover { background: var(--done); color: white; }
  .out-btn { border-color: var(--outstanding); color: var(--outstanding); background: transparent; }
  .out-btn:hover, .out-btn.active { background: var(--outstanding); color: white; }
  .clr-btn { border-color: var(--border); color: var(--muted); background: transparent; font-size: 0.58rem; }
  .clr-btn:hover { border-color: var(--muted); color: var(--ink); }

  /* STATES */
  .auth-overlay { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; padding: 2rem; text-align: center; gap: 0.75rem; min-height: 300px; }
  .ao-title { font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 700; }
  .ao-sub { font-size: 0.78rem; color: var(--muted); line-height: 1.5; max-width: 260px; }
  .btn-connect { padding: 0.55rem 1.25rem; background: var(--ink); color: var(--paper); border: none; border-radius: 2px; font-family: 'DM Sans', sans-serif; font-size: 0.82rem; cursor: pointer; }
  .btn-connect:hover { background: #2d2d4e; }
  .loading-p { display: flex; flex-direction: column; align-items: center; padding: 2.5rem; gap: 0.6rem; }
  .spinner { width: 26px; height: 26px; border: 2px solid var(--border); border-top-color: var(--ink); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .stext { font-family: 'DM Mono', monospace; font-size: 0.72rem; color: var(--muted); }
  .errmsg { background: var(--outstanding-soft); border: 1px solid var(--outstanding); border-radius: 2px; padding: 0.55rem 0.8rem; margin: 0.5rem 0.9rem; font-size: 0.72rem; color: var(--outstanding); }
  .empty { text-align: center; padding: 2.5rem 1rem; color: var(--muted); }
  .empty-t { font-family: 'Playfair Display', serif; font-size: 0.95rem; margin-bottom: 0.3rem; }
  .empty-s { font-size: 0.72rem; }

  @media (max-width: 680px) {
    .split { grid-template-columns: 1fr; }
    .panel { border-right: none; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>

<div id="setup-screen">
  <div class="setup-card">
    <div class="setup-logo">Mail<span>Triage</span></div>
    <div class="setup-sub">// dual-mailbox end-of-day review</div>

    <label class="setup-label">Azure AD App Client ID</label>
    <input type="text" class="setup-input" id="cid" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">

    <div class="mb-box mb-box-a">
      <h3>Mailbox A - Left panel</h3>
      <label class="setup-label">Email address</label>
      <input type="email" class="setup-input" id="em-a" placeholder="you@delincapital.com" style="margin-bottom:0">
    </div>

    <div class="mb-box mb-box-b">
      <h3>Mailbox B - Right panel</h3>
      <label class="setup-label">Email address</label>
      <input type="email" class="setup-input" id="em-b" placeholder="you@swarmoncology.bio" style="margin-bottom:0">
    </div>

    <button class="btn-primary" onclick="startAuth()">Sign in with Microsoft</button>
    <div class="setup-note">You will be asked to sign in twice - once per mailbox.</div>
  </div>
</div>

<div id="app">
  <header>
    <div class="header-logo">Mail<span>Triage</span></div>
    <div class="header-right">
      <span class="header-date" id="hdate"></span>
      <button class="btn-hdr" onclick="refreshAll()">Refresh</button>
      <button class="btn-so" onclick="signOut()">Sign out</button>
    </div>
  </header>
  <div class="split">
    <div class="panel" id="panel-a">
      <div class="panel-hdr" id="phdr-a">
        <div class="panel-top">
          <div><div class="panel-title" id="ptitle-a">Delin Capital</div><div class="panel-addr" id="paddr-a"></div></div>
          <div class="panel-stats" id="pstats-a"></div>
        </div>
        <div class="panel-ctrl">
          <button class="pf active" onclick="setF('a','all',this)">All</button>
          <button class="pf" onclick="setF('a','outstanding',this)">Outstanding</button>
          <button class="pf" onclick="setF('a','unread',this)">Unread</button>
          <button class="pf" onclick="setF('a','unmarked',this)">Unmarked</button>
          <input class="ps" type="search" placeholder="Search..." oninput="setS('a',this.value)">
        </div>
      </div>
      <div id="pbody-a"></div>
    </div>
    <div class="panel" id="panel-b">
      <div class="panel-hdr panel-hdr-b" id="phdr-b">
        <div class="panel-top">
          <div><div class="panel-title" id="ptitle-b">Swarm Oncology</div><div class="panel-addr" id="paddr-b"></div></div>
          <div class="panel-stats" id="pstats-b"></div>
        </div>
        <div class="panel-ctrl">
          <button class="pf active" onclick="setF('b','all',this)">All</button>
          <button class="pf" onclick="setF('b','outstanding',this)">Outstanding</button>
          <button class="pf" onclick="setF('b','unread',this)">Unread</button>
          <button class="pf" onclick="setF('b','unmarked',this)">Unmarked</button>
          <input class="ps" type="search" placeholder="Search..." oninput="setS('b',this.value)">
        </div>
      </div>
      <div id="pbody-b"></div>
    </div>
  </div>
</div>

<script>
var S = {
  a: { emails:[], token:null, filter:'all', search:'', status:'idle' },
  b: { emails:[], token:null, filter:'all', search:'', status:'idle' }
};
var CFG = { clientId:'', emailA:'', emailB:'' };

function startAuth() {
  var cid = document.getElementById('cid').value.trim();
  var ea = document.getElementById('em-a').value.trim();
  var eb = document.getElementById('em-b').value.trim();
  if (!cid || !ea) { alert('Please enter Client ID and Mailbox A email.'); return; }
  CFG = { clientId:cid, emailA:ea, emailB:eb };
  sessionStorage.setItem('mt_cfg', JSON.stringify(CFG));
  sessionStorage.setItem('mt_step', 'a');
  doAuth(cid, ea);
}

function doAuth(cid, hint) {
  var ru = encodeURIComponent(location.href.split('?')[0].split('#')[0]);
  var sc = encodeURIComponent('https://graph.microsoft.com/Mail.Read offline_access');
  var h = hint ? '&login_hint=' + encodeURIComponent(hint) : '';
  location.href = 'https://login.microsoftonline.com/common/oauth2/v2.0/authorize?client_id=' + cid + '&response_type=token&redirect_uri=' + ru + '&scope=' + sc + '&response_mode=fragment&prompt=select_account' + h;
}

function checkToken() {
  var hash = location.hash;
  if (!hash.includes('access_token=')) {
    if (hash.includes('error=')) { var p = new URLSearchParams(hash.slice(1)); alert('Auth error: ' + (p.get('error_description') || p.get('error'))); }
    return false;
  }
  var token = new URLSearchParams(hash.slice(1)).get('access_token');
  var cfg = JSON.parse(sessionStorage.getItem('mt_cfg') || '{}');
  var step = sessionStorage.getItem('mt_step');
  if (!token || !cfg.clientId) return false;
  CFG = cfg;
  history.replaceState(null, '', location.pathname + location.search);
  if (step === 'a') {
    S.a.token = token;
    sessionStorage.setItem('mt_tok_a', token);
    if (CFG.emailB) { sessionStorage.setItem('mt_step', 'b'); doAuth(CFG.clientId, CFG.emailB); return true; }
  } else {
    S.b.token = token;
    sessionStorage.setItem('mt_tok_b', token);
    S.a.token = sessionStorage.getItem('mt_tok_a');
  }
  sessionStorage.removeItem('mt_step');
  showApp(); fetchAll();
  return true;
}

function restore() {
  var cfg = JSON.parse(sessionStorage.getItem('mt_cfg') || '{}');
  var ta = sessionStorage.getItem('mt_tok_a');
  var tb = sessionStorage.getItem('mt_tok_b');
  if (cfg.clientId && ta) {
    CFG = cfg; S.a.token = ta;
    if (tb) S.b.token = tb;
    showApp(); fetchAll(); return true;
  }
  if (cfg.clientId) {
    document.getElementById('cid').value = cfg.clientId || '';
    document.getElementById('em-a').value = cfg.emailA || '';
    document.getElementById('em-b').value = cfg.emailB || '';
  }
  return false;
}

async function fetchPanel(p) {
  var panel = S[p];
  if (!panel.token) { renderAuth(p); return; }
  panel.status = 'loading'; renderBody(p);
  var url = 'https://graph.microsoft.com/v1.0/me/mailFolders/inbox/messages?$top=75&$orderby=receivedDateTime desc&$filter=receivedDateTime ge 2026-01-01T00:00:00Z&$select=id,subject,from,receivedDateTime,isRead,bodyPreview';
  try {
    var res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + panel.token } });
    if (!res.ok) { var e = await res.json().catch(function(){return {};}); throw new Error((e.error && e.error.message) || res.statusText); }
    var data = await res.json();
    panel.emails = (data.value || []).map(function(m) {
      return {
        id: p + '_' + m.id,
        from: (m.from && m.from.emailAddress && (m.from.emailAddress.name || m.from.emailAddress.address)) || 'Unknown',
        subject: m.subject || '(no subject)',
        preview: m.bodyPreview || '',
        time: m.receivedDateTime,
        isRead: m.isRead,
        status: 'unmarked'
      };
    });
    loadSt(p); panel.status = 'ready';
  } catch(e) { panel.status = 'error:' + e.message; }
  renderBody(p); renderStats(p);
}

function fetchAll() { fetchPanel('a'); if (S.b.token) fetchPanel('b'); else renderAuth('b'); }
function refreshAll() { fetchPanel('a'); if (S.b.token) fetchPanel('b'); }

function saveSt(p) {
  var m = {}; S[p].emails.forEach(function(e){ m[e.id] = e.status; });
  try { localStorage.setItem('mt_st_' + p, JSON.stringify(m)); } catch(e) {}
}
function loadSt(p) {
  try {
    var m = JSON.parse(localStorage.getItem('mt_st_' + p) || '{}');
    S[p].emails.forEach(function(e){ if (m[e.id]) e.status = m[e.id]; });
  } catch(e) {}
}

function mark(p, id, st) {
  var panel = S[p]; var e = panel.emails.find(function(x){ return x.id === id; });
  if (!e) return;
  if (st === 'done') { e.status = 'done'; saveSt(p); panel.emails = panel.emails.filter(function(x){ return x.id !== id; }); }
  else { e.status = (e.status === st ? 'unmarked' : st); saveSt(p); }
  renderBody(p); renderStats(p);
}

function setF(p, f, el) {
  S[p].filter = f;
  el.closest('.panel-ctrl').querySelectorAll('.pf').forEach(function(t){ t.classList.remove('active'); });
  el.classList.add('active');
  renderBody(p);
}
function setS(p, q) { S[p].search = q.toLowerCase(); renderBody(p); }
function signOut() { sessionStorage.clear(); localStorage.removeItem('mt_st_a'); localStorage.removeItem('mt_st_b'); location.reload(); }

function showApp() {
  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('hdate').textContent = new Date().toLocaleDateString('en-GB', {weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('paddr-a').textContent = CFG.emailA;
  document.getElementById('paddr-b').textContent = CFG.emailB || 'Not connected';
  document.getElementById('ptitle-a').textContent = label(CFG.emailA);
  document.getElementById('ptitle-b').textContent = CFG.emailB ? label(CFG.emailB) : 'Mailbox B';
}

function label(email) {
  if (!email) return 'Mailbox';
  var d = email.split('@')[1] || '';
  if (d.includes('delin')) return 'Delin Capital';
  if (d.includes('swarm')) return 'Swarm Oncology';
  return email.split('@')[0];
}

function filtered(p) {
  var panel = S[p];
  return panel.emails.filter(function(e) {
    if (panel.filter === 'outstanding' && e.status !== 'outstanding') return false;
    if (panel.filter === 'unread' && e.isRead) return false;
    if (panel.filter === 'unmarked' && e.status !== 'unmarked') return false;
    if (panel.search) { var hay = (e.from + ' ' + e.subject + ' ' + e.preview).toLowerCase(); if (!hay.includes(panel.search)) return false; }
    return true;
  });
}

function renderStats(p) {
  var es = S[p].emails;
  var total = es.length, unread = es.filter(function(e){return !e.isRead;}).length, out = es.filter(function(e){return e.status==='outstanding';}).length;
  document.getElementById('pstats-' + p).innerHTML =
    '<div class="pst"><div class="pst-dot" style="background:var(--ink)"></div><span class="pst-n">' + total + '</span><span>total</span></div>' +
    '<div class="pst"><div class="pst-dot" style="background:var(--gold)"></div><span class="pst-n">' + unread + '</span><span>unread</span></div>' +
    '<div class="pst"><div class="pst-dot" style="background:var(--outstanding)"></div><span class="pst-n">' + out + '</span><span>outstanding</span></div>';
}

function renderAuth(p) {
  var email = p === 'b' ? CFG.emailB : CFG.emailA;
  document.getElementById('pbody-' + p).innerHTML =
    '<div class="auth-overlay">' +
    '<div style="font-size:2rem">&#128274;</div>' +
    '<div class="ao-title">Connect ' + esc(label(email)) + '</div>' +
    '<div class="ao-sub">Sign in with ' + esc(email) + ' to load emails.</div>' +
    '<button class="btn-connect" onclick="authPanel(\'' + p + '\')">Sign in with Microsoft</button>' +
    '</div>';
}

function authPanel(p) {
  sessionStorage.setItem('mt_step', p);
  var email = p === 'b' ? CFG.emailB : CFG.emailA;
  doAuth(CFG.clientId, email);
}

function renderBody(p) {
  var panel = S[p]; var body = document.getElementById('pbody-' + p);
  if (panel.status === 'loading') { body.innerHTML = '<div class="loading-p"><div class="spinner"></div><div class="stext">Fetching emails...</div></div>'; return; }
  if (panel.status.startsWith('error:')) { body.innerHTML = '<div class="errmsg">Error: ' + esc(panel.status.replace('error:','')) + '</div>'; return; }
  var emails = filtered(p);
  if (!emails.length) { body.innerHTML = '<div class="empty"><div class="empty-t">All clear</div><div class="empty-s">No emails match this filter.</div></div>'; return; }
  var html = '<div class="emails">';
  emails.forEach(function(e) {
    var isOut = e.status === 'outstanding';
    html += '<div class="ecard' + (isOut ? ' out' : '') + (!e.isRead ? ' unread' : '') + '">' +
      '<div class="' + (!e.isRead ? 'udot' : 'rdot') + '"></div>' +
      '<div class="ebody">' +
        '<div class="emeta"><span class="efrom">' + esc(e.from) + '</span><span class="etime">' + fmt(e.time) + '</span></div>' +
        '<div class="esubj">' + esc(e.subject) + '</div>' +
      '</div>' +
      '<div class="eacts">' +
        '<button class="ab done-btn" onclick="mark(\'' + p + '\',\'' + e.id + '\',\'done\')">Done</button>' +
        '<button class="ab out-btn' + (isOut ? ' active' : '') + '" onclick="mark(\'' + p + '\',\'' + e.id + '\',\'outstanding\')">Outstanding</button>' +
        (isOut ? '<button class="ab clr-btn" onclick="mark(\'' + p + '\',\'' + e.id + '\',\'unmarked\')">Clear</button>' : '') +
      '</div>' +
    '</div>';
  });
  html += '</div>';
  body.innerHTML = html;
}

function fmt(iso) {
  var d = new Date(iso), now = new Date();
  return d.toDateString() === now.toDateString() ? d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

window.onload = function() { if (!checkToken()) restore(); };
</script>
